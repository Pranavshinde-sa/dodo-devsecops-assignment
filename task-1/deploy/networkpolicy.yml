apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-api-network-policy
  namespace: payments

spec:
  podSelector:
    matchLabels:
      app: ledger-api

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector: {}

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx

