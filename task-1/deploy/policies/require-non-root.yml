apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
spec:
  validationFailureAction: Enforce
  background: true

  rules:
    - name: validate-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - ingress-nginx
                - kube-system
                - argocd

      validate:
        message: "Containers must run as a non-root user."

        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
