name: Secure CI Pipeline

on:
  push:
    branches:
      - main
      - task2-secure-cicd-supply-chain

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep Scan
    uses: ./.github/workflows/semgrep.yml

  gitleaks:
    name: Gitleaks Scan
    uses: ./.github/workflows/gitleaks.yml

  dependency:
    name: Dependency scan
    uses: ./.github/workflows/dependency-scan.yml

  trivy-image:
    name: Docker image scan
    uses: ./.github/workflows/image-scan.yml

  